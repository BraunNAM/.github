name: Label-Gated MSBuild

on:
  workflow_call:
    inputs:
      job-name:
        description: Display name shown in the Actions UI
        required: false
        type: string
        default: Build (.NET / MSBuild)
      solution:
        description: Path to the .sln or .csproj to build (relative to repo root)
        required: true
        type: string
      nuget-solution-directory:
        description: >
          -SolutionDirectory value for nuget restore. Defaults to '.' (repo root).
          Set to a subdirectory if hint paths in the project expect packages there.
        required: false
        type: string
        default: .
      configuration:
        description: MSBuild configuration
        required: false
        type: string
        default: Release
      extra-msbuild-args:
        description: >
          Additional MSBuild arguments appended after /p:Configuration=... (e.g. /p:Platform="Any CPU")
        required: false
        type: string
        default: ''
      runs-on:
        description: Runner image
        required: false
        type: string
        default: windows-2022
    secrets:
      TELERIK_NUGET_USERNAME:
        description: >
          Optional username for a private NuGet feed configured in the caller's
          NuGet.Config via environment-variable-based packageSourceCredentials
          (e.g. %TELERIK_NUGET_USERNAME%). Exposed as an env var of the same
          name on the "Restore NuGet packages" step. Not Telerik-exclusive --
          any caller whose NuGet.Config expects this exact variable name can
          use it; callers that don't need it can simply omit it.
        required: false
      TELERIK_NUGET_PASSWORD:
        description: >
          Optional password/API key paired with TELERIK_NUGET_USERNAME for a
          private NuGet feed. Exposed as an env var of the same name on the
          "Restore NuGet packages" step.
        required: false
      TELERIK_LICENSE:
        description: >
          Optional license key some commercial packages (e.g. Telerik's
          Telerik.Licensing) read directly from the environment at build time.
          Exposed as an env var of the same name on the "Build" step.
        required: false

jobs:
  # push events (i.e. after a PR has already merged) always run; a
  # pull_request run only proceeds once the gating label is added. This job
  # SKIPS (does not fail) when the label is absent -- a failing
  # required-looking check on every unlabeled push reads as a false CI
  # failure/notification on routine PR activity in repos with no required
  # status checks configured, and callers relying on `needs: gate` get the
  # same skip propagated to their build job automatically.
  gate:
    name: Build Gate (requires 'Auto Build & Test' label)
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'Auto Build & Test')
    runs-on: ubuntu-latest
    steps:
      - name: Gate passed
        run: echo "Gate passed (push event or 'Auto Build & Test' label present)."

  build:
    needs: gate
    name: ${{ inputs.job-name }}
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        env:
          TELERIK_NUGET_USERNAME: ${{ secrets.TELERIK_NUGET_USERNAME }}
          TELERIK_NUGET_PASSWORD: ${{ secrets.TELERIK_NUGET_PASSWORD }}
        run: nuget restore "${{ inputs.solution }}" -SolutionDirectory "${{ inputs.nuget-solution-directory }}"

      - name: Build
        env:
          TELERIK_LICENSE: ${{ secrets.TELERIK_LICENSE }}
        run: msbuild "${{ inputs.solution }}" /p:Configuration=${{ inputs.configuration }} ${{ inputs.extra-msbuild-args }} /m

